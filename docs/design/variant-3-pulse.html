  /* ---------- КАРТА ---------- */
  .map-wrap { position:absolute; inset:0; }
  .map-wrap svg.map { position:absolute; inset:0; width:100%; height:100%; }
  .map-ui { position:relative; z-index:3; height:100%; display:flex; flex-direction:column; padding:12px 16px 14px; }
  .map-search { display:flex; align-items:center; gap:10px; padding:0 16px; height:54px; margin-top:34px; }
  .map-search span { font-size:14px; color:#A19D90; font-weight:700; }
  .marker { position:absolute; z-index:2; display:flex; flex-direction:column; align-items:center; gap:7px; }

  .m-name { font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; background:#C6F24E; border:2.5px solid #141414; padding:4px 11px; border-radius:8px; white-space:nowrap; box-shadow:3px 3px 0 #141414; }
  .me { position:absolute; z-index:2; width:26px; height:26px; border-radius:50%; background:#FF5A3C; border:4px solid #141414; box-shadow:0 0 0 9px rgba(255,90,60,.25); }
  .fabs { position:absolute; right:16px; bottom:316px; display:flex; flex-direction:column; gap:14px; z-index:4; }
  .fab { width:54px; height:54px; border-radius:18px; display:flex; align-items:center; justify-content:center; box-shadow:5px 5px 0 #141414; border:3px solid #141414; }
  .sheet { padding:18px 16px 12px; }
  .sheet-title { display:flex; align-items:center; gap:10px; font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
  .pulse-dot { width:12px; height:12px; border-radius:50%; background:#FF5A3C; border:2.5px solid #141414; }
  .sheet-sub { font-size:12px; color:#55534B; font-weight:700; margin:4px 0 12px; }
  .near-row { display:flex; align-items:center; gap:12px; padding:10px 6px; border-radius:14px; }
  .near-row + .near-row { border-top:2px dashed #D8D3C4; }
  .near-meta { flex:1; min-width:0; }
  .near-meta b { display:block; font-size:15px; font-weight:800; }
  .near-meta i { font-style:normal; font-size:12px; color:#55534B; font-weight:600; }
  .tag { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:5px 10px; border-radius:8px; border:2.5px solid #141414; }
  .tag.on { background:#C6F24E; } .tag.mv { background:#FFD447; } .tag.off { background:#E8E3D3; color:#77746A; }

  /* ---------- ДРУЗЬЯ ---------- */
  .scr-body { padding:14px 22px 0; display:flex; flex-direction:column; height:calc(100% - 44px); position:relative; z-index:2; }
  .h1row { display:flex; align-items:center; gap:12px; margin:2px 0 16px; }
  .h1row h2 { font-family:'Unbounded',sans-serif; font-size:36px; font-weight:900; text-transform:uppercase; letter-spacing:-.01em; }
  .h1row .cnt { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; background:#FF5A3C; color:#fff; border:3px solid #141414; padding:5px 13px; border-radius:12px; box-shadow:3px 3px 0 #141414; }
  .h1row .plus { margin-left:auto; width:46px; height:46px; border-radius:15px; background:#C6F24E; border:3px solid #141414; display:flex; align-items:center; justify-content:center; box-shadow:4px 4px 0 #141414; }
  .search { display:flex; align-items:center; gap:10px; height:54px; padding:0 16px; margin-bottom:14px; }
  .search span { font-size:14px; color:#A19D90; font-weight:600; }
  .tabs { display:flex; gap:10px; margin-bottom:20px; }

  .sec { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#77746A; margin:0 0 10px; }
  .grp-row { display:flex; gap:14px; margin-bottom:22px; }
  .grp-card { flex:1; padding:14px; }

  .grp-card i { font-style:normal; font-size:12px; color:#55534B; font-weight:700; }
  .stack { display:flex; }

  .stack .avatar:first-child { margin-left:0; }

  .fr-row + .fr-row { border-top:2px dashed #D8D3C4; }
  .fr-ava-wrap { position:relative; }
  .fr-ava-wrap .st { position:absolute; right:-3px; bottom:-3px; width:16px; height:16px; border-radius:50%; border:3px solid #F6F3EA; }
  .fr-meta { flex:1; }
  .fr-meta b { display:block; font-size:15.5px; font-weight:800; }
  .fr-meta i { font-style:normal; font-size:12.5px; color:#55534B; font-weight:600; }
  .icon-btn { width:42px; height:42px; border-radius:13px; background:#fff; border:3px solid #141414; display:flex; align-items:center; justify-content:center; box-shadow:3px 3px 0 #141414; }

  /* ---------- ШАРИНГ ---------- */
  .bigcard { padding:18px; display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .bigcard .t b { display:block; font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; }
  .bigcard .t i { font-style:normal; font-size:12px; color:#55534B; font-weight:700; }
  .switch { margin-left:auto; width:64px; height:38px; border-radius:12px; background:#C6F24E; position:relative; border:3px solid #141414; box-shadow:3px 3px 0 #141414; }
  .switch::after { content:'ON'; position:absolute; top:4px; right:5px; width:26px; height:24px; border-radius:8px; background:#141414; color:#C6F24E; font-size:8.5px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .sw-off { background:#E8E3D3; }
  .sw-off::after { content:'OFF'; left:5px; right:auto; background:#fff; color:#141414; }
  .opt { padding:16px; display:flex; align-items:center; gap:13px; margin-bottom:14px; }
  .opt .emoji { width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center; border:3px solid #141414; flex-shrink:0; }

  .radio { margin-left:auto; width:28px; height:28px; border-radius:50%; border:3px solid #141414; background:#fff; flex-shrink:0; }
  .opt.sel { background:#141414; color:#F6F3EA; box-shadow:5px 5px 0 #C6F24E, 5px 5px 0 3px #141414; }
  .opt.sel b { color:#C6F24E; } .opt.sel i { color:#B5B0A0; }
  .opt.sel .radio { border-color:#C6F24E; background:#C6F24E; display:flex; align-items:center; justify-content:center; }
  .sel-list { padding:6px 18px 4px; margin-bottom:16px; }
  .sel-row { display:flex; align-items:center; gap:12px; padding:12px 0; }
  .sel-row + .sel-row { border-top:2px dashed #D8D3C4; }
  .sel-row b { font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; flex:1; }
  .x { width:30px; height:30px; border-radius:10px; background:#E8E3D3; border:3px solid #141414; display:flex; align-items:center; justify-content:center; color:#141414; font-size:13px; font-weight:800; }

  /* ---------- ПРОФИЛЬ ---------- */
  .prof-head { display:flex; align-items:center; gap:18px; padding:16px 22px 18px; position:relative; z-index:2; }
  .prof-ava { width:92px; height:92px; border-radius:26px; background:#C6F24E; padding:5px; }
  .prof-ava .avatar { width:100%; height:100%; border-radius:20px; font-family:'Unbounded',sans-serif; font-size:26px; border:3px solid #141414; }
  .prof-head h3 { font-family:'Unbounded',sans-serif; font-size:21px; font-weight:900; text-transform:uppercase; line-height:1.05; }
  .prof-head p { font-size:12.5px; color:#55534B; font-weight:700; margin-top:7px; }
  .stats { display:flex; gap:12px; padding:0 22px; margin-bottom:16px; position:relative; z-index:2; }
  .stat { flex:1; padding:12px 0 10px; text-align:center; }
  .stat b { display:block; font-family:'Unbounded',sans-serif; font-size:23px; font-weight:900; }
  .stat i { font-style:normal; font-size:10px; color:#55534B; font-weight:800; letter-spacing:.08em; }
  .stat.s1 b { color:#3D5BFF; } .stat.s2 b { color:#FF5A3C; } .stat.s3 b { color:#0E9F6E; }
  .prof-list { padding:8px 22px; margin-bottom:14px; position:relative; z-index:2; }
  .p-row { display:flex; align-items:center; gap:13px; padding:14px 4px; }
  .p-row + .p-row { border-top:2px dashed #D8D3C4; }
  .p-ic { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; border:3px solid #141414; }
  .p-row b { font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; flex:1; }
  .prof-btns { padding:0 22px; display:flex; flex-direction:column; gap:12px; position:relative; z-index:2; }
  .ghost-btn { text-align:center; padding:15px; border-radius:18px; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; color:#141414; background:#fff; text-transform:uppercase; letter-spacing:.05em; border:3px solid #141414; box-shadow:5px 5px 0 #FF5A3C, 5px 5px 0 3px #141414; }
  .nav { position:absolute; bottom:18px; left:22px; right:22px; height:74px; border-radius:22px; display:flex; align-items:center; padding:0 14px; z-index:6; background:#fff; border:3px solid #141414; box-shadow:5px 5px 0 #141414; }
  .nav-i { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:800; color:#A19D90; text-transform:uppercase; letter-spacing:.04em; }

</style>
</head>
