name: Android CI/CD

# Пуш в main — проверочная сборка, APK доступен как artifact экшена.
# Пуш тега v* — сборка и публикация GitHub Release: APK скачивает кто угодно без авторизации.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Настроить Gradle (кэш зависимостей)
        uses: gradle/actions/setup-gradle@v4

      - name: Восстановить local.properties (MAPS_API_KEY)
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties

      - name: Восстановить release-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Собрать release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Переименовать APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          mv app/build/outputs/apk/release/app-release.apk "ShareMyLocation-$VERSION.apk"

      - name: Загрузить APK как artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareMyLocation-APK
          path: ShareMyLocation-*.apk

      - name: Извлечь patch notes из CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { gsub(/\./, "\\.", ver) }
            /^## \[/ {
              if (active) exit
              if ($0 ~ "^## \\[" ver "\\]") active = 1
            }
            active { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Изменения для версии $VERSION не найдены в CHANGELOG.md" > release_notes.md
          fi

      - name: Опубликовать GitHub Release с APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ShareMyLocation-*.apk
          body_path: release_notes.md
          fail_on_unmatched_files: true
